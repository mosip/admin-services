FetchTitle:
   MasterData_FetchTitle_all_valid_smoke:
      endPoint: /v1/masterdata/title
      uniqueIdentifier: TC_Masterdata_FetchTitle_01
      description: Verify that the system successfully fetches title details when all valid input parameters are provided
      role: admin
      restMethod: get
      inputTemplate: masterdata/FetchTitle/fetchTitle
      outputTemplate: masterdata/FetchTitle/fetchTitleResult
      input: '{
   "langcode":"$REMOVE$"
}'
      output: '{
"titleList": [{
        "isActive": true
      }]
}'
   MasterData_FetchTitle_valid_smoke:
      endPoint: /v1/masterdata/title/{langcode}
      uniqueIdentifier: TC_Masterdata_FetchTitle_02
      description: Verify that the system successfully fetches title details when valid input parameters are provided
      role: admin
      restMethod: get
      inputTemplate: masterdata/FetchTitle/fetchTitle
      outputTemplate: masterdata/FetchTitle/fetchTitleResult
      input: '{
   "langcode":"eng"
}'
      output: '{
"titleList": [{
        "isActive": true
      }]
}'
   MasterData_FetchTitle_invalid_langcode:
      endPoint: /v1/masterdata/title/{langcode}
      uniqueIdentifier: TC_Masterdata_FetchTitle_03
      description: Verify that the system returns an error when an invalid language code is provided while fetching title details
      role: admin
      restMethod: get
      inputTemplate: masterdata/FetchTitle/fetchTitle
      outputTemplate: masterdata/error
      input: '{
   "langcode":"GER"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-048",
      "message": "Title not found"
    }
  ]
}'