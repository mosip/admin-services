SearchDynamicField:
   MasterData_SearchDynamicField_Valid_Smoke:
      endPoint: /v1/masterdata/dynamicfields/search
      uniqueIdentifier: TC_Masterdata_SearchDynamicField_01
      description: Verify that the system successfully retrieves dynamic fields when all valid parameters are provided (smoke test)
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/SearchDynamicField/searchDynamicField
      outputTemplate: masterdata/SearchDynamicField/searchDynamicFieldResult
      input: '{
	"filters": [],
	"sort": [{
		"sortField": "createdDateTime",
		"sortType": "ASC"
	}],
	"pageStart": 0,
	"pageFetch": 10,
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": null
}'
   MasterData_SearchDynamicField_Valid_Filter_Name:
      endPoint: /v1/masterdata/dynamicfields/search
      uniqueIdentifier: TC_Masterdata_SearchDynamicField_02
      description: Verify that the system successfully retrieves dynamic fields when a valid Name filter is applied
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/SearchDynamicField/searchDynamicField
      outputTemplate: masterdata/SearchDynamicField/searchDynamicFieldResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "equals",
		"value": "bloodType"
	}],
	"sort": [{
		"sortField": "createdDateTime",
		"sortType": "ASC"
	}],
	"pageStart": 0,
	"pageFetch": 10,
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": null
}'
   MasterData_SearchDynamicField_Invalid_NegPageFetch:
      endPoint: /v1/masterdata/dynamicfields/search
      uniqueIdentifier: TC_Masterdata_SearchDynamicField_03
      description: Verify that the system returns an error when a negative page number is provided while fetching dynamic fields
      role: admin
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/SearchDynamicField/searchDynamicField
      outputTemplate: masterdata/error
      input: '{
    "filters": [{
         "columnName": "name",
		"type": "equals",
		"value": "bloodType"
      }],
    "sort": [{
       "sortField": "createdDateTime",
	   "sortType": "ASC"
	  }],
    "pageStart": 0,
    "pageFetch": -1,
    "languageCode": "eng",
    "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
       "errorCode": "KER-MSD-999",
       "message": "request.pagination.pageFetch: Should have positive integer value"
    }
  ]
}'
