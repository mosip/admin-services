TemplateType:
   Kernel_TemplateType_allValid_smoke:
      endPoint: /v1/masterdata/templatetypes/{code}/{langcode}
      uniqueIdentifier: TC_Masterdata_TemplateType_01
      description: Verify that the system successfully returns all template types when a valid request is made (smoke test)
      role: admin
      restMethod: get
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/TemplateType/templateTypeResult
      input: '{
  "langcode": "eng",
  "code": "auth-email-content"
}'
      output: '{
"templateTypes": [{
			"isActive": true
		}]
}'
   Kernel_TemplateType_inValid_code:
      endPoint: /v1/masterdata/templatetypes/{code}/{langcode}
      uniqueIdentifier: TC_Masterdata_TemplateType_02
      description: Verify that the system returns an error or handles gracefully when an invalid template type code is provided
      role: admin
      restMethod: get
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
  "langcode": "eng",
  "code": "autmail-content"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-398",
      "message": "Template Type not Found"
    }
  ]
}'
   Kernel_TemplateType_inValid_langcode:
      endPoint: /v1/masterdata/templatetypes/{code}/{langcode}
      uniqueIdentifier: TC_Masterdata_TemplateType_03
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching template types
      role: admin
      restMethod: get
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
  "langcode": "enegd3662yu2bg",
  "code": "auth-email-content"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-398",
      "message": "Template Type not Found"
    }
  ]
}'
   Kernel_TemplateType_allValid_smoke_langcode:
      endPoint: /v1/masterdata/templatetypes/{langcode}
      uniqueIdentifier: TC_Masterdata_TemplateType_04
      description: Verify that the system successfully returns all template types for a valid language code (smoke test)
      role: admin
      restMethod: get
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/TemplateType/templateTypeResult
      input: '{
  "langcode": "eng",
  "code": "$REMOVE$"
}'
      output: '{
"templateTypes": [{
			"isActive": true
		}]
}'
   Kernel_TemplateType_INValid_langcode:
      endPoint: /v1/masterdata/templatetypes/{langcode}
      uniqueIdentifier: TC_Masterdata_TemplateType_05
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching template types
      role: admin
      restMethod: get
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
  "langcode": "ehsjsshsjshng",
  "code": "$REMOVE$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-398",
      "message": "Template Type not Found"
    }
  ]
}'