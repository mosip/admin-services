FilterTemplateDetails:
   MasterData_FilterTemplateDetails_All_Valid_Smoke:
      endPoint: /v1/masterdata/templates/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterTemplateDetails_01
      description: Verify that the system successfully filters template details and returns the expected results when all input parameters are valid
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["languageCode"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateTemplate_01
      inputTemplate: masterdata/FilterTemplateDetails/filterTemplateDetails
      outputTemplate: masterdata/FilterTemplateDetails/filterTemplateDetailsResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "unique",
		"text": "test template"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "$IGNORE$",
        "fieldValue": "$IGNORE$"
      }
    ]
  }'
   MasterData_FilterTemplateDetails_FilterType_all:
      endPoint: /v1/masterdata/templates/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterTemplateDetails_02
      description: Verify that the system successfully filters template details with filter type set to "All" when a valid request is provided
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["languageCode"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateTemplate_01
      inputTemplate: masterdata/FilterTemplateDetails/filterTemplateDetails
      outputTemplate: masterdata/FilterTemplateDetails/filterTemplateDetailsResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "all",
		"text": "test template"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "$IGNORE$",
        "fieldValue": "$IGNORE$"
      }
    ]
  }'
   MasterData_FilterTemplateDetails_Invalid_filterType:
      endPoint: /v1/masterdata/templates/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterTemplateDetails_03
      description: Verify that the system returns an error when an invalid filter type is provided while filtering template details
      role: admin
      templateFields: ["text"]
      restMethod: post
      inputTemplate: masterdata/FilterTemplateDetails/filterTemplateDetails
      outputTemplate: masterdata/error
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "ghji",
		"text": "authorization"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-324",
      "message": "Received Filter Type not supported"
    }
  ]
}'
   MasterData_FilterTemplateDetails_invalid_text:
      endPoint: /v1/masterdata/templates/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterTemplateDetails_04
