CreateLocationData:
   MasterData_CreateLocationData_All_Valid_Smoke:
      endPoint: /v1/masterdata/locations
      description: Verify that the system successfully creates location data when all required fields are provided with valid values
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["name","hierarchyName"]
      restMethod: post
      inputTemplate: masterdata/LocationData/locationData
      outputTemplate: masterdata/LocationData/locationDataResult
      input: '{
    "code": "TST12",
    "name": "Test_Loc_A_",
    "hierarchyLevel": "$HIERARCHYLEVEL$",
    "hierarchyName": "$HIERARCHYNAME$",
    "parentLocCode": "$PARENTLOCCODE$",
    "langCode": "eng",
    "isActive": true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
"isActive": "$REMOVE$",
"code": "TST12",
"name": "Test_Loc_A_",
"hierarchyLevel": "$REMOVE$",
"hierarchyName": "$REMOVE$",
"parentLocCode": "$REMOVE$",
"langCode": "$REMOVE$"
}'
   MasterData_CreateLocationData_Invalid_EmptyCode_SecondaryLang_eng:
      endPoint: /v1/masterdata/locations
      description: Verify that the system returns an error when the location code is empty for the secondary language (English) during location data creation
