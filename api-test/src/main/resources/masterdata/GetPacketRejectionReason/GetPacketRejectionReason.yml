GetPacketRejectionReason:
   Masterdata_GetPacketRejectionReason_allValid_smoke:
      endPoint: /v1/masterdata/packetrejectionreasons/{reasoncategorycode}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetPacketRejectionReason_01
      description: Verify that the system successfully returns all packet rejection reasons when a valid request is made (smoke test)
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["langcode"]
      restMethod: get
      inputTemplate: masterdata/GetPacketRejectionReason/getPacketRejectionReason
      outputTemplate: masterdata/GetPacketRejectionReason/getPacketRejectionReasonResult
      input: '{
  "reasoncategorycode":"MNA",
  "langcode":"eng"
}'
      output: '{
   "errors": null
}'  
   Masterdata_GetPacketRejectionReason_with_empty_data:
      endPoint: /v1/masterdata/packetrejectionreasons/{reasoncategorycode}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetPacketRejectionReason_02
      description: Verify that the system returns an appropriate response or handles gracefully when no packet rejection reasons are available (empty data)
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetPacketRejectionReason/getPacketRejectionReason
      outputTemplate: masterdata/error
      input: '{
  "reasoncategorycode":"$IGNORE$",
  "langcode":"$IGNORE$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-036",
      "message": "Reason not found"
    }
  ]
}'
   Masterdata_GetPacketRejectionReason_Invalid_reasoncategorycode:
      endPoint: /v1/masterdata/packetrejectionreasons/{reasoncategorycode}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetPacketRejectionReason_03
      description: Verify that the system returns an error or handles gracefully when an invalid reason category code is provided while fetching packet rejection reasons
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetPacketRejectionReason/getPacketRejectionReason
      outputTemplate: masterdata/error
      input: '{
  "reasoncategorycode":"a@b@12c",
  "langcode":"eng"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-036",
      "message": "Reason not found"
    }
  ]
}'

   Masterdata_GetPacketRejectionReason_Invalid_langcode:
      endPoint: /v1/masterdata/packetrejectionreasons/{reasoncategorycode}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetPacketRejectionReason_04
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching packet rejection reasons
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetPacketRejectionReason/getPacketRejectionReason
      outputTemplate: masterdata/error
      input: '{
  "reasoncategorycode":"MNA",
  "langcode":"abc"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-036",
      "message": "Reason not found"
    }
  ]
}'
   
