FetchDevice:
   MasterData_FetchDevice_allValid_smoke_with_lang:
      endPoint: /v1/masterdata/devices/{langCode}
      uniqueIdentifier: TC_Masterdata_FetchDevice_01
      description: Verify that the system successfully fetches all device records using valid input data and language code
      role: admin
      templateFields: ["name","description"]
      restMethod: get
      additionalDependencies: TC_Masterdata_CreateDevice_01
      inputTemplate: masterdata/FetchDevice/fetchDevice
      outputTemplate: masterdata/FetchDevice/fetchDeviceResult
      input: '{
  "deviceType": "$REMOVE$",
  "langCode": "eng",
  "regCenterId": "$REMOVE$"
}'
      output: '{
"devices": [{
            "isActive": true
        }]
}'       
   MasterData_FetchDevice_allValid_smoke_with_lang_and_deviceType:
      endPoint: /v1/masterdata/devices/{langCode}/{deviceType}
      uniqueIdentifier: TC_Masterdata_FetchDevice_02
      description: Verify that the system successfully fetches all device records using valid language code and device type
      role: admin
      templateFields: ["name","description"]
      restMethod: get
      additionalDependencies: TC_Masterdata_CreateDevice_01
      inputTemplate: masterdata/FetchDevice/fetchDevice
      outputTemplate: masterdata/FetchDevice/fetchDeviceResult
      input: '{
  "deviceType": "AUTO4$TESTDATACONTEXT$",
  "langCode": "eng",
  "regCenterId": "$REMOVE$"
}'
      output: '{
"devices": [{
            "isActive": true
        }]
}'
   MasterData_FetchDevice_allValid_smoke_with_regCentre:
      endPoint: /v1/masterdata/devices/mappeddevices/{regCenterId}
      uniqueIdentifier: TC_Masterdata_FetchDevice_03
      description: Verify that the system successfully fetches all device records using valid registration center details
      role: admin
      checkErrorsOnlyInResponse: true
      restMethod: get
      additionalDependencies: TC_Masterdata_CreateDevice_01
      inputTemplate: masterdata/FetchDevice/fetchDevice
      outputTemplate: masterdata/FetchDevice/fetchDeviceByCenterResult
      input: '{
  "regCenterId": "10005",
  "deviceType": "$REMOVE$",
  "langCode": "$REMOVE$"
}'
      output: '{
"devices": [{
            "isActive": true
        }]
}'
   MasterData_FetchDevice_invalid_regCentre:
      endPoint: /v1/masterdata/devices/mappeddevices/{regCenterId}
      uniqueIdentifier: TC_Masterdata_FetchDevice_04
      description: Verify that the system returns an error when an invalid registration center is used to fetch device records
      role: admin
      restMethod: get
      inputTemplate: masterdata/FetchDevice/fetchDevice
      outputTemplate: masterdata/error
      input: '{
  "regCenterId": "100@@345",
  "deviceType": "$REMOVE$",
  "langCode": "$REMOVE$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-441",
      "message": "Registration Center and Device Not Found"
    }
  ]
}'       
   MasterData_FetchDevice_invalid_deviceType_unexisting:
      endPoint: /v1/masterdata/devices/{langCode}/{deviceType}
      uniqueIdentifier: TC_Masterdata_FetchDevice_05
      description: Verify that the system returns an error when a non-existent device type is used to fetch device records
      role: admin
      restMethod: get
      inputTemplate: masterdata/FetchDevice/fetchDevice
      outputTemplate: masterdata/error
      input: '{
  "deviceType": "notInDB",
  "langCode": "eng",
  "regCenterId": "$REMOVE$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-010",
      "message": "Device not Found"
    }
  ]
}'       
