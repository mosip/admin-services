GetMachineHistory:
   Admin_GetMachineHistory_allValid_smoke:
      endPoint: /v1/masterdata/machineshistories/{id}/{langcode}/{effdatetimes}
      uniqueIdentifier: TC_Masterdata_GetMachineHistory_01
      description: Verify that the system successfully returns the complete machine history when a valid request is made (smoke test)
      role: admin
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: masterdata/GetMachineHistory/getMachineHistory
      outputTemplate: masterdata/GetMachineHistory/getMachineHistoryResult
      input: '{
      "id":"10001",
      "langcode":"eng",
      "effdatetimes":"$TIMESTAMP$"
}'
      output: '{
"machineHistoryDetails": [{
       "id": "10001"
    }]
}'

   Admin_GetMachineHistory_Invalid_Invalid_lD:
      endPoint: /v1/masterdata/machineshistories/{id}/{langcode}/{effdatetimes}
      uniqueIdentifier: TC_Masterdata_GetMachineHistory_02
      description: Verify that the system returns an error or handles gracefully when an invalid machine ID is provided while fetching machine history
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetMachineHistory/getMachineHistory
      outputTemplate: masterdata/error
      input: '{
      "id":"abc",
      "langcode":"eng",
      "effdatetimes":"2021-10-19T06:04:22.475Z"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-032",
      "message": "Machine History not found"
    }
  ]
}'

   Admin_GetMachineHistory_Invalid_Invalid_effdatetimes:
      endPoint: /v1/masterdata/machineshistories/{id}/{langcode}/{effdatetimes}
      uniqueIdentifier: TC_Masterdata_GetMachineHistory_03
      description: Verify that the system returns an error or handles gracefully when invalid effective date/time values are provided while fetching machine history
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetMachineHistory/getMachineHistory
      outputTemplate: masterdata/error
      input: '{
      "id":"10001",
      "langcode":"eng",
      "effdatetimes":"abc"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-033"
    }
  ]
}'

   Admin_GetMachineHistory_Invalid_Invalid_langCode:
      endPoint: /v1/masterdata/machineshistories/{id}/{langcode}/{effdatetimes}
      uniqueIdentifier: TC_Masterdata_GetMachineHistory_04
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching machine history
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetMachineHistory/getMachineHistory
      outputTemplate: masterdata/error
      input: '{
      "id":"10001",
      "langcode":"abc",
      "effdatetimes":"2021-10-19T06:04:22.475Z"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-032"
    }
  ]
}'