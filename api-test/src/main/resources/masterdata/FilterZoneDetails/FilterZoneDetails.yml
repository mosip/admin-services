FilterZoneDetails:
   Admin_FilterZoneDetails_Valid_Request_Smoke:
      endPoint: /v1/masterdata/zones/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterZoneDetails_01
      description: Verify that the system successfully filters zone details and returns the expected results when a valid request is provided
      role: admin
      restMethod: post
      inputTemplate: masterdata/FilterZoneDetails/filterZoneDetails
      outputTemplate: masterdata/FilterZoneDetails/filterZoneDetailsResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "all",
		"text": "MyCountry"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "name",
        "fieldValue": "MyCountry",
        "fieldCode": "MOR"
      }
    ]
  }'
     
   Admin_FilterZoneDetails_Invalid_EmptyFilterType:
      endPoint: /v1/masterdata/zones/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterZoneDetails_02
      description: Verify that the system returns an error when a blank filter type is provided while filtering zone details
      role: admin
      restMethod: post
      inputTemplate: masterdata/FilterZoneDetails/filterZoneDetails
      outputTemplate: masterdata/error
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "",
		"text": "MyCountry"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-322",
      "message": "Filter Type cannot be empty or null"
    }
  ]
}'

   Admin_FilterZoneDetails_Invalid_InvalidFilterType:
      endPoint: /v1/masterdata/zones/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterZoneDetails_03
      description: Verify that the system returns an error when an invalid filter type is provided while filtering zone details
      role: admin
      restMethod: post
      inputTemplate: masterdata/FilterZoneDetails/filterZoneDetails
      outputTemplate: masterdata/error
      input: '{
  "filters": [{
    "columnName": "name",
    "type": "abc",
    "text": "MyCountry"
  }],
  "languageCode": "eng",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-324",
      "message": "Received Filter Type not supported"
    }
  ]
}'

   Admin_FilterZoneDetails_Invalid_InvalidcolumnName:
      endPoint: /v1/masterdata/zones/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterZoneDetails_04
      description: Verify that the system returns an error when an invalid column name is provided while filtering zone details
      role: admin
      restMethod: post
      inputTemplate: masterdata/FilterZoneDetails/filterZoneDetails
      outputTemplate: masterdata/error
      input: '{
  "filters": [{
    "columnName": "abc",
    "type": "all",
    "text": "MyCountry"
  }],
  "languageCode": "eng",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-317"
    }
  ]
}'

   Admin_FilterZoneDetails_Invalid_EmptycolumnName:
      endPoint: /v1/masterdata/zones/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterZoneDetails_05
      description: Verify that the system returns an error when a blank column name is provided while filtering zone details
      role: admin
      restMethod: post
      inputTemplate: masterdata/FilterZoneDetails/filterZoneDetails
      outputTemplate: masterdata/error
      input: '{
  "filters": [{
    "columnName": "",
    "type": "all",
    "text": "MyCountry"
  }],
  "languageCode": "eng",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999"
    }
  ]
}'