GetIdTypeByLangCode:
   Admin_GetIdTypeByLangCode_allValid_smoke:
      endPoint: /v1/masterdata/idtypes/{langcode}
      uniqueIdentifier: TC_Masterdata_GetIdTypeByLangCode_01
      description: Verify that the system successfully returns all ID types for a valid language code (smoke test)
      role: admin
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: masterdata/GetIdTypeByLangCode/getIdTypeByLangCode
      outputTemplate: masterdata/GetIdTypeByLangCode/getIdTypeByLangCodeResult
      input: '{
      "langcode":"eng"
}'
      output: '{
"idtypes": [{
       "code": "$REMOVE$",
        "descr": "$REMOVE$",
        "name": "$REMOVE$",
        "isActive": "$REMOVE$"
    }]
}'

   Admin_GetIdTypeByLangCode_InValid_Invalid_langCode:
      endPoint: /v1/masterdata/idtypes/{langcode}
      uniqueIdentifier: TC_Masterdata_GetIdTypeByLangCode_02
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching ID types
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetIdTypeByLangCode/getIdTypeByLangCode
      outputTemplate: masterdata/error
      input: '{
      "langcode":"eng1"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-022",
      "message": "ID Type not found."
    }
  ]
}'