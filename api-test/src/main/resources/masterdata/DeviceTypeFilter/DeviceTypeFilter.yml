      role: admin
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/DeviceTypeFilter/deviceTypeFilter
      outputTemplate: masterdata/DeviceTypeFilter/deviceTypeFilterResult
      input: '{
	"filters": [{
		"columnName": "code",
		"type": "unique",
		"text": "$ID:CreateDeviceType_All_Valid_Mandatory_Fields_Smoke_Sid_code$"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "code",
        "fieldValue": "$ID:CreateDeviceType_All_Valid_Mandatory_Fields_Smoke_Sid_code$"
      }
    ]
  }'  
