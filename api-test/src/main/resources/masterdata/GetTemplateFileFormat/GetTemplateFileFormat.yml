GetTemplateFileFormat:
   Masterdata_GetTemplateFileFormat_allValid_smoke:
      endPoint: /v1/masterdata/templatefileformats/{code}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetTemplateFileFormat_01
      description: Verify that the system successfully returns all template file formats when a valid request is made (smoke test)
      role: admin
      templateFields: ["langcode"]
      restMethod: get
      inputTemplate: masterdata/GetTemplateFileFormat/getTemplateFileFormat
      outputTemplate: masterdata/GetTemplateFileFormat/getTemplateFileFormatResult
      input: '{
  "langcode": "eng",
  "code": "json"
}'
      output: '{
"templateFileFormats": [{
    "code": "json",
	"isActive": true
		}]
}'
   Masterdata_GetTemplateFileFormat_inValid_code:
      endPoint: /v1/masterdata/templatefileformats/{code}/{langcode}
      uniqueIdentifier: TC_Masterdata_GetTemplateFileFormat_02
      description: Verify that the system returns an error or handles gracefully when an invalid code is provided while fetching template file formats
      role: admin
      templateFields: ["langcode"]
      restMethod: get
      inputTemplate: masterdata/GetTemplateFileFormat/getTemplateFileFormat
      outputTemplate: masterdata/error
      input: '{
  "langcode": "eng",
  "code": "jdhdudhdson"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-046",
      "message": "Template not found."
    }
  ]
}'
   Masterdata_GetTemplateFileFormat_langcode_allValid_smoke:
      endPoint: /v1/masterdata/templatefileformats/code/{code}
      uniqueIdentifier: TC_Masterdata_GetTemplateFileFormat_03
      description: Verify that the system successfully returns all template file formats when no language code is provided (smoke test)
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetTemplateFileFormat/getTemplateFileFormat
      outputTemplate: masterdata/GetTemplateFileFormat/getTemplateFileFormatResult
      input: '{
  "langcode": "$REMOVE$",
  "code": "json"
}'
      output: '{
"templateFileFormats": [{
    "code": "json",
	"isActive": true
		}]
}'