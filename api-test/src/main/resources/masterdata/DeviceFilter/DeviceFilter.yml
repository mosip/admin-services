      input: '{
	"filters": [{
		"columnName": "name",
		"type": "all",
		"text": "Mock IRIS Scanner"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "name",
        "fieldValue": "Mock IRIS Scanner"
      }
    ]
  }'    
       
