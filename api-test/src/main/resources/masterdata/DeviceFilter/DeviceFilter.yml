DeviceFilter:
   MasterData_DeviceFilter_Name_eng_Unique_smoke:
      endPoint: /v1/masterdata/devices/filtervalues
      uniqueIdentifier: TC_Masterdata_DeviceFilter_01
      description: Verify that the system correctly filters devices by unique name in English and returns accurate results
      role: globalAdmin
      templateFields: ["languageCode"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateDevice_01
      inputTemplate: masterdata/DeviceFilter/deviceFilter
      outputTemplate: masterdata/DeviceFilter/deviceFilterResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "unique",
		"text": "Mock IRIS Scanner"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "name",
        "fieldValue": "Mock IRIS Scanner"
      }
    ]
  }'    
   MasterData_DeviceFilter_Name_eng_All_smoke:
      endPoint: /v1/masterdata/devices/filtervalues
      uniqueIdentifier: TC_Masterdata_DeviceFilter_02
      description: Verify that the system correctly filters devices by name in English and returns all matching records
      role: globalAdmin
      templateFields: ["languageCode"]
