   MasterData_FilterDocCatTypMapping_inValid_filterType_blank:
      endPoint: /v1/masterdata/documenttypes/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterDocumentType_04
      description: Verify that the system returns an error when a blank filter type is provided while filtering document category–type mappings
      role: admin
      templateFields: ["text"]
      restMethod: post
      inputTemplate: masterdata/FilterDocumentType/filterDocumentType
      outputTemplate: masterdata/error
      input: '{
	"filters": [{
		"columnName": "code",
		"type": "",
		"text": "TestDocType0010"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-322",
      "message": "Filter Type cannot be empty or null"
    }
  ]
}'
   
