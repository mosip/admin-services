FilterDocumentType:
   MasterData_FilterDocumentType_Valid_Smoke:
      endPoint: /v1/masterdata/documenttypes/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterDocumentType_01
      description: Verify that the system successfully filters document types and returns the expected results when a valid request is provided
      role: admin
      templateFields: ["text"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateDocumentType_01
      inputTemplate: masterdata/FilterDocumentType/filterDocumentType
      outputTemplate: masterdata/FilterDocumentType/filterDocumentTypeResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "unique",
		"text": "TestDocType0010 Card"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "name"
      }
    ]
  }'
   MasterData_FilterDocumentType_Valid_TypeAll:
      endPoint: /v1/masterdata/documenttypes/filtervalues
