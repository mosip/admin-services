GetWeekDay:
   MasterData_GetWeekDay_allValid_smoke:
      endPoint: /v1/masterdata/weekdays/{registrationCenterId}/{langCode}
      uniqueIdentifier: TC_Masterdata_GetWeekDay_01
      description: Verify that the system successfully returns all weekdays when a valid request is made (smoke test)
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetWeekDay/getWeekDay
      outputTemplate: masterdata/GetWeekDay/getWeekDayResult
      input: '{
  "registrationCenterId":"10001",
  "langCode": "eng"
}'
      output: '{
      "weekdays": [{
      }]
}'
   MasterData_GetWeekDay_InValid_InvalidLangCode:
      endPoint: /v1/masterdata/weekdays/{registrationCenterId}/{langCode}
      uniqueIdentifier: TC_Masterdata_GetWeekDay_02
      description: Verify that the system returns an error or handles gracefully when an invalid language code is provided while fetching weekdays
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetWeekDay/getWeekDay
      outputTemplate: masterdata/error
      input: '{
  "registrationCenterId":"10001",
  "langCode": "eng1"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "Language Code is Invalid"
    }
  ]
}'

   MasterData_GetWeekDay_InValid_InvalidRegCentCode:
      endPoint: /v1/masterdata/weekdays/{registrationCenterId}/{langCode}
      uniqueIdentifier: TC_Masterdata_GetWeekDay_03
      description: Verify that the system returns an error or handles gracefully when an invalid registration center code is provided while fetching weekdays
      role: admin
      restMethod: get
      inputTemplate: masterdata/GetWeekDay/getWeekDay
      outputTemplate: masterdata/error
      input: '{
  "registrationCenterId":"abc",   
  "langCode": "eng"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-802",
      "message": "Center ID is invalid"
    }
  ]
}'
   