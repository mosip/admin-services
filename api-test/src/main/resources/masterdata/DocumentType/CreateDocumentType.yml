CreateDocumentType:
   MasterData_CreateDocumentType_Valid_Smoke_Sid:
      endPoint: /v1/masterdata/documenttypes
      uniqueIdentifier: TC_Masterdata_CreateDocumentType_01
      description: Verify that the system can create a document type successfully with all valid inputs
      role: admin
      templateFields: ["name","description"]
      restMethod: post
      inputTemplate: masterdata/DocumentType/documentType
      outputTemplate: masterdata/DocumentType/documentTypeResult
      input: '{
	"code": "AutoDocType0010$TESTDATACONTEXT$",
	"description": "TestDocType0010 Card Holder",
	"isActive": true,
	"langCode": "eng",
	"name": "TestDocType0010 Card $TESTDATACONTEXT$",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
	"code": "AutoDocType0010$TESTDATACONTEXT$",
	"description": "TestDocType0010 Card Holder",
	"isActive": "$REMOVE$",
	"name": "TestDocType0010 Card $TESTDATACONTEXT$"
}'
   MasterData_CreateDocumentType_All_Valid_Mandatory_Fields_Smoke_Eng_Sid:
      endPoint: /v1/masterdata/documenttypes
      uniqueIdentifier: TC_Masterdata_CreateDocumentType_02
      description: Verify that the system can create a document type successfully using only mandatory fields
      role: admin
