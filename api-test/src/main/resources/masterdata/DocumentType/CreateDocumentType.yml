      outputTemplate: masterdata/DocumentType/documentTypeResult
      input: '{
	"code": "AutoDocType0020$TESTDATACONTEXT$",
	"description": "$REMOVE$",
	"isActive": true,
	"langCode": "eng",
	"name": "TestDocType0020 Card",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
