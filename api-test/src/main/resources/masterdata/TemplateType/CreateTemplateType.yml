CreateTemplateType:
   MasterData_CreateTemplateType_All_Valid_Smoke_Sid:
      endPoint: /v1/masterdata/templatetypes
      uniqueIdentifier: TC_Masterdata_CreateTemplateType_01
      description: Verify that the system successfully creates a template type when all input parameters are valid (smoke test)
      role: admin
      templateFields: ["description"]
      restMethod: post
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/TemplateType/templateTypeResult
      input: '{
     "code": "Test-info-Template-auto-$TESTDATACONTEXT$",
    "description": "Test-info-Template auto description",
    "isActive":true,
    "langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
	"code": "Test-info-Template-auto-$TESTDATACONTEXT$"
}'
   
   
   MasterData_CreateTemplateType_InputParameter_Code_Missing:
      endPoint: /v1/masterdata/templatetypes
      uniqueIdentifier: TC_Masterdata_CreateTemplateType_02
      description: Verify that the system returns an error when the Code input parameter is missing while creating a template type
      role: admin
      templateFields: ["description"]
      restMethod: post
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
     "code": "$REMOVE$",
    "description": "Test-info-Template desc",
    "isActive":true,
    "langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: must not be null"
    }
  ]
}'
   MasterData_CreateTemplateType_InputParameter_Code_AboveMaxLen36:
      endPoint: /v1/masterdata/templatetypes
      uniqueIdentifier: TC_Masterdata_CreateTemplateType_03
      description: Verify that the system returns an error when Code exceeds 36 characters while creating a template type
      role: admin
      templateFields: ["description"]
      restMethod: post
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
     "code": "abcdefghijklmnopqrstuvwxyzabcdefghijk",
    "description": "Test-info-Template desc",
    "isActive":true,
    "langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: Should not be blank or size must be between 1 and 36"
    }
  ]
}'
   

   MasterData_CreateTemplateType_InputParameter_isActive_Missing:
      endPoint: /v1/masterdata/templatetypes
      uniqueIdentifier: TC_Masterdata_CreateTemplateType_04
      description: Verify that the system returns an error when the isActive input parameter is missing while creating a template type
      role: admin
      templateFields: ["description"]
      restMethod: post
      inputTemplate: masterdata/TemplateType/templateType
      outputTemplate: masterdata/error
      input: '{
     "code": "Test-info-Template",
    "description": "Test-info-Template desc",
    "isActive":"$REMOVE$",
    "langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.isActive: must not be null"
    }
  ]
}'