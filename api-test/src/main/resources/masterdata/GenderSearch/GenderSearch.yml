GenderSearch:
   Masterdata_GenderSearch_Valid_Smoke:
      endPoint: /v1/masterdata/gendertypes/search
      uniqueIdentifier: TC_Masterdata_GenderSearch_01
      description: Verify that the system successfully returns gender entries when a valid filter is applied
      role: admin
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/GenderSearch/search
      outputTemplate: masterdata/GenderSearch/searchResult
      input: '{

	"filters": [],
	"sort": [{
		"sortField": "genderName",
		"sortType": "ASC"
	}],

	"pageStart": 0,
	"pageFetch": 10,
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
}'
   Masterdata_GenderSearch_valid_lang:
      endPoint: /v1/masterdata/gendertypes/search
      uniqueIdentifier: TC_Masterdata_GenderSearch_02
      description: Verify that the system returns gender entries correctly when the language code is valid
      role: admin
      templateFields: ["languageCode"]
      restMethod: post
      inputTemplate: masterdata/GenderSearch/search
      outputTemplate: masterdata/GenderSearch/searchResult
      input: '{
    "filters": [{
        "columnName": "code",
        "type": "equals",
        "value": "FLE"
      }
    ],
    "sort": [
      {
			        "sortField": "genderName",
			        "sortType": "ASC"
			      }
    ],
  
      "pageStart": 0,
      "pageFetch": 10,
    "languageCode": "eng",
  "requesttime": "$TIMESTAMP$"
}'
      output: '{
}'
