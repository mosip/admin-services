      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["name"]
      restMethod: post
      inputTemplate: masterdata/LocationController/locationData
      outputTemplate: masterdata/LocationController/locationDataResult
      input: '{
    "code": "TST12$TESTDATACONTEXT$",
    "name": "Test_Loc_A_$TESTDATACONTEXT$",
    "hierarchyLevel": "$HIERARCHYLEVEL$",
    "hierarchyName": "$HIERARCHYNAME$",
    "parentLocCode": "$PARENTLOCCODE$",
    "langCode": "eng",
    "isActive": true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
"isActive": "$REMOVE$",
"code": "TST12$TESTDATACONTEXT$",
"name": "Test_Loc_A_$TESTDATACONTEXT$",
