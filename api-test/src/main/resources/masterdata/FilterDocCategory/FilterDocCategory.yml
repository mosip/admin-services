FilterDocCategory:
   MasterData_FilterDocCategory_Valid_Request_Smoke:
      endPoint: /v1/masterdata/documentcategories/filtervalues
      uniqueIdentifier: TC_Masterdata_FilterDocCategory_01
      description: Verify that the system successfully filters document categories and returns the expected results when a valid request is provided
      role: admin
      checkErrorsOnlyInResponse: true
      templateFields: ["text"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateDocumentCategory_01
      inputTemplate: masterdata/FilterDocCategory/filterDocCategory
      outputTemplate: masterdata/FilterDocCategory/filterDocCategoryResult
      input: '{
	"filters": [{
		"columnName": "code",
		"type": "unique",
		"text": "DocTestCode01"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
  }'
   MasterData_FilterDocCategory_Valid_column_code_filterType_all:
      endPoint: /v1/masterdata/documentcategories/filtervalues
