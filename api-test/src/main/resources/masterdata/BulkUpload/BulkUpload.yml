      role: admin
      restMethod: post
      inputTemplate: masterdata/BulkUpload/bulkUpload
      outputTemplate: masterdata/BulkUpload/bulkUploadResult
      input: '{
   "category":"masterdata",
    "files":["masterdata/BulkUpload/FilesToUpload/gender.csv"],
