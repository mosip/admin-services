UpdateGender:
   Masterdata_UpdateGender_Valid_Smoke:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_UpdateGender_01
      description: Verify that the system successfully updates a gender entry when all input parameters are valid
      role: admin
      templateFields: ["langCode"]
      restMethod: put
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/Gender/genderResult
      input: '{
	"code": "Genderdummy",
	"genderName": "TestGenderName updated",
	"isActive": true,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
	"code": "Genderdummy"
}'
   Masterdata_UpdateGender_Invalid_InputParameter_Code_Missing:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_UpdateGender_02
      description: Verify that the system returns an error when the gender code is missing while updating a gender entry
      role: admin
      templateFields: ["langCode"]
      restMethod: put
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "$REMOVE$",
	"genderName": "TestGenderName",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: must not be null"
    }
  ]
}'
   Masterdata_UpdateGender_Invalid_InputParameter_Code_Empty:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_UpdateGender_03
      description: Verify that the system returns an error when the gender code is empty while updating a gender entry
      role: admin
      templateFields: ["langCode"]
      restMethod: put
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "",
	"genderName": "TestGenderName",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: Should not be blank or size must be between 1 and 16"
    }
  ]
}'
