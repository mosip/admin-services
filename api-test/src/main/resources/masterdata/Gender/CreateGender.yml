CreateGender:
   Masterdata_CreateGender_Valid_Smoke_sid:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_01
      description: Verify that the system successfully creates a gender entry when all input parameters are valid
      role: admin
      templateFields: ["genderName"]
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/Gender/genderResult
      input: '{
	"code": "Genderdummy",
	"genderName": "TestGenderName",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
	"code": "Genderdummy"
}'
   Masterdata_CreateGender_Invalid_InputParameter_Code_Missing:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_02
      description: Verify that the system returns an error when the gender code is missing while creating a gender entry
      role: admin
      templateFields: ["genderName"]
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "$REMOVE$",
	"genderName": "TestGenderName",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: must not be null"
    }
  ]
}'
   Masterdata_CreateGender_Invalid_InputParameter_Code_Empty:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_03
      description: Verify that the system returns an error when the gender code is empty while creating a gender entry
      role: admin
      templateFields: ["genderName"]
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "",
	"genderName": "TestGenderName",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.code: Should not be blank or size must be between 1 and 16"
    }
  ]
}'
   
   Masterdata_CreateGender_Invalid_InputParameter_GenderName_Empty:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_04
      description: Verify that the system returns an error when the gender name is empty while creating a gender entry
      role: admin
      templateFields: ["langCode"]
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "Genderdummy",
	"genderName": "",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.genderName: Should not be blank or size must be between 1 and 64"
    }
  ]
}'
   Masterdata_CreateGender_Invalid_InputParameter_GenderName_AboveMaxLen64:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_05
      description: Verify that the system returns an error when the gender name exceeds the maximum length of 64 characters while creating a gender entry
      role: admin
      templateFields: []
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "Genderdummy",
	"genderName": "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklm",
	"isActive": false,
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.genderName: Should not be blank or size must be between 1 and 64"
    }
  ]
}'
   Masterdata_CreateGender_InputParameter_isActive_Missing:
      endPoint: /v1/masterdata/gendertypes
      uniqueIdentifier: TC_Masterdata_CreateGender_06
      description: Verify that the system returns an error when the isActive parameter is missing while creating a gender entry
      role: admin
      templateFields: ["genderName"]
      restMethod: post
      inputTemplate: masterdata/Gender/gender
      outputTemplate: masterdata/error
      input: '{
	"code": "Genderdummy",
	"genderName": "TestGenderName",
	"isActive": "$REMOVE$",
	"langCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.isActive: must not be null"
    }
  ]
}'
