      role: admin
      templateFields: []
      restMethod: patch
      inputTemplate: masterdata/UpdateDeviceTypeStatus/updateDeviceTypeStatus
      outputTemplate: masterdata/UpdateDeviceTypeStatus/updateteDeviceTypeStatusResult
