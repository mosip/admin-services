CreateRegCenterType:
   MasterData_CreateRegCenterType_All_Valid_Smoke_sid:
      endPoint: /v1/masterdata/registrationcentertypes
      uniqueIdentifier: TC_Masterdata_CreateRegCenterType_01
      description: Verify that the system successfully creates a registration center type when all input parameters are valid
      role: admin
      templateFields: ["name","descr"]
      restMethod: post
      inputTemplate: masterdata/RegCenterType/regCenterType
      outputTemplate: masterdata/RegCenterType/regCenterTypeResult
      input: '{
    "code": "ALT-3$TESTDATACONTEXT$",
    "langCode": "eng",
    "name": "alternate",
    "descr": "alternate center",
    "isActive":true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
	"code": "ALT-3$TESTDATACONTEXT$",
	"langCode": "eng"
}'

   MasterData_CreateRegCenterType_Dublicate_Centertype_Neg:
      endPoint: /v1/masterdata/registrationcentertypes
      uniqueIdentifier: TC_Masterdata_CreateRegCenterType_02
      description: Verify that the system returns an error when attempting to create a registration center type with a duplicate name
      role: admin
      templateFields: ["name","descr"]
      restMethod: post
      inputTemplate: masterdata/RegCenterType/regCenterType
      outputTemplate: masterdata/error
      input: '{
    "code": "ALT-3$TESTDATACONTEXT$",
    "langCode": "eng",
    "name": "alternate",
    "descr": "alternate center",
    "isActive":true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
	"errors": [
    {
      "errorCode": "KER-MSD-101"
    }
  ]
}'
   
   
   MasterData_CreateRegCenterType_InputParameter_Name_Missing:
      endPoint: /v1/masterdata/registrationcentertypes
      uniqueIdentifier: TC_Masterdata_CreateRegCenterType_03
      description: Verify that the system returns an error when the registration center type name is missing in the creation request
      role: admin
      templateFields: ["descr"]
      restMethod: post
      inputTemplate: masterdata/RegCenterType/regCenterType
      outputTemplate: masterdata/error
      input: '{
    "code": "ALT-5",
    "langCode": "eng",
    "name": "$REMOVE$",
    "descr": "alternate center",
    "isActive":true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "KER-MSD-999",
      "message": "request.name: must not be null"
    }
  ]
}'
