DeviceSpecFilter:
   MasterData_DeviceSpecFilter_Unique_Name_eng_smoke:
      endPoint: /v1/masterdata/devicespecifications/filtervalues
      uniqueIdentifier: TC_Masterdata_DeviceSpecFilter_01
      description: Verify that the system correctly filters device specifications by unique name in English
      role: admin
      templateFields: ["languageCode"]
      restMethod: post
      additionalDependencies: TC_Masterdata_CreateDeviceSpecification_01
      inputTemplate: masterdata/DeviceSpecFilter/deviceSpecFilter
      outputTemplate: masterdata/DeviceSpecFilter/deviceSpecFilterResult
      input: '{
	"filters": [{
		"columnName": "name",
		"type": "unique",
		"text": "Fingerprint Scanner"
	}],
	"languageCode": "eng",
	"requesttime": "$TIMESTAMP$"
}'
      output: '{
    "filters": [
      {
        "fieldID": "name",
        "fieldValue": "Fingerprint Scanner"
      }
    ]
  }'
